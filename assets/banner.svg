<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowPill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.25)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .orb {
        transform-origin: center;
        animation: floatOrb 10s ease-in-out infinite alternate;
      }
      .orb-reverse {
        transform-origin: center;
        animation: floatOrbRev 12s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 12;
        animation: dash 20s linear infinite;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }

      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(35px, 20px) scale(1.1); }
        100% { transform: translate(-25px, 30px) scale(0.95); }
      }
      @keyframes floatOrbRev {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, -25px) scale(1.08); }
        100% { transform: translate(30px, -15px) scale(0.92); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Ambient Glow Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb" cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.18" />
    <circle class="orb-reverse" cx="980" cy="220" r="160" fill="#818cf8" opacity="0.18" />
    <circle class="orb" cx="600" cy="340" r="120" fill="#c084fc" opacity="0.12" />
  </g>

  <!-- High-Tech Coordinate Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Connecting Network Lines & Flow Nodes (in Background) -->
  <g opacity="0.6">
    <path class="dash-flow" d="M 120 340 Q 320 280 600 320 T 1080 300" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    <path class="dash-flow" d="M 80 100 Q 400 60 700 110 T 1120 80" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />
    <!-- Floating geometric nodes -->
    <circle cx="280" cy="295" r="4" fill="#38bdf8" />
    <circle cx="600" cy="320" r="5" fill="#818cf8" />
    <circle cx="920" cy="307" r="4" fill="#c084fc" />
    <circle cx="390" cy="85" r="3" fill="#38bdf8" opacity="0.7" />
    <circle cx="720" cy="112" r="4" fill="#818cf8" opacity="0.7" />
  </g>

  <!-- TOP ACCENT BADGE PILL (Foreground) -->
  <g transform="translate(430, 48)">
    <rect class="pulse-pill" width="340" height="34" rx="17" fill="url(#glowPill1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#e0f2fe" class="tagline-text" font-size="13" letter-spacing="0.5">
      CURATED REVOPS &amp; DATA QUALITY STACK
    </text>
  </g>

  <!-- MAIN TITLE (Foreground, crystal clear contrast) -->
  <g transform="translate(600, 160)">
    <!-- Ambient back-shadow for guaranteed high-contrast readability -->
    <text x="0" y="0" text-anchor="middle" fill="#030712" opacity="0.8" class="title-text" font-size="52">
      Awesome CRM Data Cleansing &amp; Hygiene
    </text>
    <text x="0" y="-1" text-anchor="middle" fill="url(#textGrad)" class="title-text" font-size="52" filter="url(#subtleGlow)">
      Awesome CRM Data Cleansing &amp; Hygiene
    </text>
    <text x="0" y="-1" text-anchor="middle" fill="url(#textGrad)" class="title-text" font-size="52">
      Awesome CRM Data Cleansing &amp; Hygiene
    </text>
  </g>

  <!-- SUBTITLE (Foreground) -->
  <g transform="translate(600, 215)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="20">
      The authoritative guide to deduplication, field normalization, record enrichment &amp; data governance
    </text>
  </g>

  <!-- FEATURE PILLS (Foreground) -->
  <g transform="translate(190, 275)">
    <!-- Pill 1: Deduplication -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" fill="#bae6fd" class="tagline-text" font-size="14">⚡ Smart Deduplication</text>
    </g>
    <!-- Pill 2: Entity Resolution -->
    <g transform="translate(205, 0)">
      <rect width="185" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
      <text x="92" y="26" text-anchor="middle" fill="#c7d2fe" class="tagline-text" font-size="14">🔗 Entity Resolution</text>
    </g>
    <!-- Pill 3: Normalization -->
    <g transform="translate(415, 0)">
      <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" fill="#e9d5ff" class="tagline-text" font-size="14">✨ Field Normalization</text>
    </g>
    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(620, 0)">
      <rect width="200" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.2" />
      <text x="100" y="26" text-anchor="middle" fill="#99f6e4" class="tagline-text" font-size="14">🚀 SaaS &amp; Open Source</text>
    </g>
  </g>

  <!-- BOTTOM ACCENT LINE -->
  <line x1="200" y1="365" x2="1000" y2="365" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4" />
</svg>
